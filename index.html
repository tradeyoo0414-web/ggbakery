<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GGBAKERY</title>
  <meta name="description" content="GGBAKERY - 매일 굽는 빵">
  <link rel="canonical" href="https://ggbakery.co.kr/">
  <meta property="og:title" content="GGBAKERY">
  <meta property="og:url" content="https://ggbakery.co.kr/">
  <meta property="og:type" content="website">
  <style>
    :root { --bg:#fbf6ef; --fg:#3b2a1a; --accent:#c8813a; }
    * { box-sizing:border-box; margin:0; }
    body { font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; background:var(--bg); color:var(--fg); }
    header, main, footer { max-width:960px; margin:0 auto; padding:24px 16px; }
    header { display:flex; justify-content:space-between; align-items:center; }
    .logo { font-weight:800; font-size:1.5rem; letter-spacing:.05em; }
    .hero { text-align:center; padding:80px 16px; }
    .hero h1 { font-size:clamp(2rem,6vw,3.5rem); margin-bottom:16px; }
    .hero p { font-size:1.1rem; opacity:.8; }
    .btn { display:inline-block; margin-top:28px; padding:12px 28px; background:var(--accent); color:#fff; border-radius:999px; text-decoration:none; }
    footer { text-align:center; font-size:.85rem; opacity:.6; }
  </style>
</head>
<body>
  <header><div class="logo">GGBAKERY</div></header>
  <main>
    <section class="hero">
      <h1>매일 아침, 갓 구운 빵</h1>
      <p>GGBAKERY에 오신 것을 환영합니다.</p>
      <a class="btn" href="#">메뉴 보기</a>
    </section>
  </main>
  <footer>© 2026 GGBAKERY · ggbakery.co.kr</footer>
</body>
</html>
